<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo con gradiente verde oscuro -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a3420"/>
      <stop offset="55%" stop-color="#1a2014"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Gradiente del símbolo ❖ -->
    <linearGradient id="simbolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8e2c4"/>
      <stop offset="45%" stop-color="#95a584"/>
      <stop offset="100%" stop-color="#5a6a48"/>
    </linearGradient>

    <!-- Brillo/glow detrás del símbolo -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#95a584" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#95a584" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombra del símbolo -->
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Halo suave detrás del símbolo -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- ❖ · Flor de cuatro pétalos -->
  <g filter="url(#sombra)">
    <path d="M 256 100
             C 290 180, 290 200, 256 256
             C 222 200, 222 180, 256 100 Z
             M 412 256
             C 332 290, 312 290, 256 256
             C 312 222, 332 222, 412 256 Z
             M 256 412
             C 222 332, 222 312, 256 256
             C 290 312, 290 332, 256 412 Z
             M 100 256
             C 180 222, 200 222, 256 256
             C 200 290, 180 290, 100 256 Z"
          fill="url(#simbolo)"
          stroke="#d8e2c4"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Pequeño punto central brillante -->
  <circle cx="256" cy="256" r="8" fill="#e8f0d4" opacity="0.8"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Esporas decorativas (muy sutiles) -->
  <circle cx="140" cy="140" r="4" fill="#95a584" opacity="0.35"/>
  <circle cx="380" cy="160" r="3" fill="#95a584" opacity="0.3"/>
  <circle cx="160" cy="380" r="3" fill="#95a584" opacity="0.3"/>
  <circle cx="370" cy="370" r="4" fill="#95a584" opacity="0.35"/>
</svg>